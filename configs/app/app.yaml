title: "DigDeep — Rally Extractor"
window_width: 1400
window_height: 900
window_min_width: 1100
window_min_height: 700
progress_update_interval: 100   # frames between QProgressBar updates
output_suffix: "_rallies"
ffmpeg_crf: 23
ffmpeg_preset: "fast"
# Model paths — override with env vars (DIGDEEP_BALL_MODEL, DIGDEEP_PLAYER_MODEL,
# DIGDEEP_REID_MODEL) or set here. Null = use built-in defaults.
ball_model_path: null
player_model_path: null
reid_model_path: null
