title: "DigDeep — Rally Extractor"
window_width: 800
window_height: 400
progress_update_interval: 100   # frames between QProgressBar updates
output_suffix: "_rallies"
ffmpeg_crf: 23
ffmpeg_preset: "fast"
# Ball model path — override with DIGDEEP_BALL_MODEL env var or set here.
# Defaults to ~/digdeep-training/models/VballNetFastV1_seq9_grayscale_233_h288_w512.onnx
ball_model_path: null
